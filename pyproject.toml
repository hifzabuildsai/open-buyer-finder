[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-buyer-finder"
version = "0.2.0"
description = "Turn a product URL into sourced market research and outreach drafts."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Hifza Zafar"}]
dependencies = []

[project.scripts]
buyerfind = "buyerfind.cli:main"

[tool.setuptools.packages.find]
include = ["buyerfind*"]

[tool.setuptools.package-data]
buyerfind = ["web/*.html", "web/*.css", "web/*.js"]
