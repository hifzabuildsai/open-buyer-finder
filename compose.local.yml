services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
  searxng:
    image: docker.io/searxng/searxng:latest
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config/searxng.yml:/etc/searxng/settings.yml:ro
volumes:
  ollama-data:
